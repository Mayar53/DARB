# Netlify deployment config. Vercel needs no config (zero-config Next.js).
# The Next.js runtime plugin is installed automatically by Netlify.
#
# This is a monorepo (backend/ + frontend/), so the base directory points at the
# frontend; the command and publish paths are relative to it.
[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  # Netlify prefers this file over the repo-root netlify.toml when the base
  # directory is set, so the NEXT_PUBLIC_* values must be declared here (the
  # root file carries the same ones for the base-directory-empty case).
  #
  # They must exist at BUILD time: lib/env.ts validates NEXT_PUBLIC_API_URL and
  # fails the build if it is missing.
  NEXT_PUBLIC_API_URL = "https://darb-backend-dli6.onrender.com/api"
  # Lets next/image load media served by the backend (images.remotePatterns).
  NEXT_PUBLIC_MEDIA_HOST = "darb-backend-dli6.onrender.com"
