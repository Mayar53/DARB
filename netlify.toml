# Netlify build configuration — MUST live at the repository root for Netlify to
# read it. This is a monorepo (backend/ + frontend/), so `base` points at the
# frontend; `command` and `publish` are relative to that base.
#
# Next.js Runtime plugin handles the App Router build/serving automatically.
[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  # NEXT_PUBLIC_* values are inlined into the browser bundle at build time, so
  # they must exist during the build (here or in the Netlify UI). lib/env.ts
  # validates NEXT_PUBLIC_API_URL and fails the build if it is missing.
  NEXT_PUBLIC_API_URL = "https://darb-backend-dli6.onrender.com/api"
  # Lets next/image load media served by the backend (images.remotePatterns).
  NEXT_PUBLIC_MEDIA_HOST = "darb-backend-dli6.onrender.com"
