# Infrastructure ONLY, for local development WITHOUT Docker for the app.
# Run the services here, then run Django on the host with uv:
#
#   docker compose -f docker-compose.dev.yml up -d
#   uv run python manage.py runserver
#
# Note: config.settings.dev defaults to SQLite + local file storage, so this is
# only needed when you want to develop against real Postgres/Redis/MinIO.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: karkh
      POSTGRES_USER: karkh
      POSTGRES_PASSWORD: karkh
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata_dev:/data

volumes:
  pgdata_dev:
  miniodata_dev:
